<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 3D Card Lip & Outer Border -->
  <rect x="4" y="6" width="56" height="54" rx="14" fill="#cfc8b8" stroke="#0b0f11" stroke-width="5" />
  <!-- Ivory Card Face -->
  <rect x="4" y="4" width="56" height="52" rx="14" fill="#fffdf5" stroke="#0b0f11" stroke-width="5" />
  <!-- Subtle Inner Playing Card Frame -->
  <rect x="10" y="10" width="44" height="40" rx="8" fill="none" stroke="#dfd8c8" stroke-width="2" />

  <!-- Corner Pips (Chips Blue with 3D lip) -->
  <rect x="14" y="16" width="10" height="10" rx="3" fill="#005b99" />
  <rect x="14" y="14" width="10" height="10" rx="3" fill="#009dff" />

  <rect x="40" y="16" width="10" height="10" rx="3" fill="#005b99" />
  <rect x="40" y="14" width="10" height="10" rx="3" fill="#009dff" />

  <rect x="14" y="38" width="10" height="10" rx="3" fill="#005b99" />
  <rect x="14" y="36" width="10" height="10" rx="3" fill="#009dff" />

  <rect x="40" y="38" width="10" height="10" rx="3" fill="#005b99" />
  <rect x="40" y="36" width="10" height="10" rx="3" fill="#009dff" />

  <!-- Center Pip (Mult Red with 3D lip) -->
  <rect x="26" y="27" width="12" height="12" rx="3.5" fill="#9e2820" />
  <rect x="26" y="25" width="12" height="12" rx="3.5" fill="#fe5f55" />
</svg>

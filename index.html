<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dice</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3Erect%7Bfill:%23ffffff;stroke:%231c1b18%7Dcircle%7Bfill:%231c1b18%7D@media(prefers-color-scheme:dark)%7Brect%7Bfill:%23171717;stroke:%23f2ede4%7Dcircle%7Bfill:%23f2ede4%7D%7D%3C/style%3E%3Crect x='4' y='4' width='56' height='56' rx='14' stroke-width='5'/%3E%3Ccircle cx='20' cy='20' r='5'/%3E%3Ccircle cx='44' cy='20' r='5'/%3E%3Ccircle cx='32' cy='32' r='5'/%3E%3Ccircle cx='20' cy='44' r='5'/%3E%3Ccircle cx='44' cy='44' r='5'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f5f0e6;
      --surface: #ffffff;
      --text: #1c1b18;
      --muted: #78736a;
      --border: #dfdad0;
      --die-bg: #ffffff;
      --die-border: #1c1b18;
      --pip: #1c1b18;
      --pip-one: #d9463e;
      --accent: #1c1b18;
      --accent-fg: #f5f0e6;
      --shadow: rgba(28, 27, 24, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --surface: #171717;
        --text: #f2ede4;
        --muted: #8a857c;
        --border: #2a2a2a;
        --die-bg: #171717;
        --die-border: #e5e0d8;
        --pip: #f2ede4;
        --pip-one: #e5534b;
        --accent: #f2ede4;
        --accent-fg: #0d0d0d;
        --shadow: rgba(0, 0, 0, 0.45);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: manipulation;
    }

    main {
      width: 100%;
      height: 100dvh;
      max-width: 680px;
      margin: 0 auto;
      padding: clamp(20px, 5vw, 40px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Top Bar */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-display {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .result-label {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .result-value {
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.1s ease;
    }

    .btn-ghost:hover {
      border-color: var(--text);
    }

    .btn-ghost:active {
      transform: scale(0.96);
    }

    /* Dice Stage */
    .stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .dice-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: clamp(16px, 4vw, 28px);
      width: 100%;
    }

    .die {
      width: clamp(76px, 20vw, 112px);
      height: clamp(76px, 20vw, 112px);
      background: var(--die-bg);
      border: 2px solid var(--die-border);
      border-radius: clamp(16px, 3.5vw, 22px);
      box-shadow: 0 8px 24px var(--shadow);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: clamp(12px, 2.8vw, 18px);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .die.rolling {
      animation: shake 0.32s ease-in-out infinite;
    }

    .die.pop {
      transform: scale(1.06);
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-4px, -6px) rotate(-6deg); }
      50% { transform: translate(4px, 3px) rotate(6deg); }
      75% { transform: translate(-3px, 4px) rotate(-4deg); }
    }

    .pip {
      width: 72%;
      height: 72%;
      margin: auto;
      border-radius: 50%;
      background: var(--pip);
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.1s ease, transform 0.12s ease;
    }

    .pip.active {
      opacity: 1;
      transform: scale(1);
    }

    .die[data-val="1"] .pip.active {
      background: var(--pip-one);
      width: 88%;
      height: 88%;
    }

    /* Bottom Roll Button */
    footer {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .btn-primary {
      width: 100%;
      max-width: 320px;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* On-Load Dice Count Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-backdrop.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .modal-card {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .btn-step {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease, transform 0.1s ease;
    }

    .btn-step:hover {
      border-color: var(--text);
    }

    .btn-step:active {
      transform: scale(0.93);
    }

    .count-number {
      font-size: 56px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 72px;
      line-height: 1;
    }

    .quick-picks {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-pick {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-pick.active {
      border-color: var(--text);
      color: var(--text);
      background: var(--surface);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="result-display" aria-live="polite">
        <span class="result-label">Total</span>
        <span class="result-value" id="total-val">0</span>
      </div>
      <button class="btn-ghost" id="btn-change-count">
        Dice: <span id="hud-count">2</span>
      </button>
    </header>

    <section class="stage" id="stage-area">
      <div class="dice-grid" id="dice-grid"></div>
    </section>

    <footer>
      <button class="btn-primary" id="btn-roll">Roll</button>
    </footer>
  </main>

  <!-- On-load prompt for number of dice -->
  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h1 class="modal-title" id="modal-title">How many dice?</h1>

      <div class="stepper">
        <button class="btn-step" id="btn-minus" aria-label="Decrease">−</button>
        <div class="count-number" id="modal-count">2</div>
        <button class="btn-step" id="btn-plus" aria-label="Increase">+</button>
      </div>

      <div class="quick-picks" id="quick-picks">
        <button class="btn-pick" data-count="1">1</button>
        <button class="btn-pick active" data-count="2">2</button>
        <button class="btn-pick" data-count="3">3</button>
        <button class="btn-pick" data-count="4">4</button>
        <button class="btn-pick" data-count="5">5</button>
        <button class="btn-pick" data-count="6">6</button>
      </div>

      <button class="btn-primary" id="btn-start">Roll Dice</button>
    </div>
  </div>

  <script>
    const PIP_PATTERNS = {
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8]
    };

    const MIN_DICE = 1;
    const MAX_DICE = 12;

    let diceCount = 2;
    let values = [];
    let isRolling = false;

    const diceGridEl = document.getElementById('dice-grid');
    const totalValEl = document.getElementById('total-val');
    const hudCountEl = document.getElementById('hud-count');
    const btnRollEl = document.getElementById('btn-roll');
    const btnChangeCountEl = document.getElementById('btn-change-count');

    const modalEl = document.getElementById('modal');
    const modalCountEl = document.getElementById('modal-count');
    const btnMinusEl = document.getElementById('btn-minus');
    const btnPlusEl = document.getElementById('btn-plus');
    const quickPicksEl = document.getElementById('quick-picks');
    const btnStartEl = document.getElementById('btn-start');

    function setDiceCount(n) {
      diceCount = Math.max(MIN_DICE, Math.min(MAX_DICE, n));
      modalCountEl.textContent = diceCount;
      hudCountEl.textContent = diceCount;
      quickPicksEl.querySelectorAll('.btn-pick').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.count) === diceCount);
      });
    }

    function buildDice() {
      diceGridEl.innerHTML = '';
      values = Array.from({ length: diceCount }, () => 1);

      for (let i = 0; i < diceCount; i++) {
        const die = document.createElement('div');
        die.className = 'die';
        for (let p = 0; p < 9; p++) {
          const pip = document.createElement('div');
          pip.className = 'pip';
          die.appendChild(pip);
        }
        diceGridEl.appendChild(die);
        renderFace(i, values[i]);
      }
    }

    function renderFace(index, val) {
      const die = diceGridEl.children[index];
      if (!die) return;
      die.dataset.val = val;
      const active = PIP_PATTERNS[val] || [];
      const pips = die.querySelectorAll('.pip');
      pips.forEach((pip, i) => {
        pip.classList.toggle('active', active.includes(i));
      });
    }

    function roll() {
      if (isRolling) return;
      isRolling = true;

      const diceEls = Array.from(diceGridEl.children);
      diceEls.forEach(d => {
        d.classList.remove('pop');
        d.classList.add('rolling');
      });

      const interval = setInterval(() => {
        diceEls.forEach((_, i) => {
          renderFace(i, Math.floor(Math.random() * 6) + 1);
        });
      }, 60);

      setTimeout(() => {
        clearInterval(interval);
        let sum = 0;
        diceEls.forEach((die, i) => {
          const val = Math.floor(Math.random() * 6) + 1;
          values[i] = val;
          sum += val;
          die.classList.remove('rolling');
          die.classList.add('pop');
          renderFace(i, val);
          setTimeout(() => die.classList.remove('pop'), 180);
        });
        totalValEl.textContent = sum;
        isRolling = false;
      }, 320);
    }

    btnMinusEl.addEventListener('click', () => setDiceCount(diceCount - 1));
    btnPlusEl.addEventListener('click', () => setDiceCount(diceCount + 1));

    quickPicksEl.querySelectorAll('.btn-pick').forEach(btn => {
      btn.addEventListener('click', () => setDiceCount(Number(btn.dataset.count)));
    });

    btnStartEl.addEventListener('click', () => {
      modalEl.classList.add('hidden');
      buildDice();
      roll();
    });

    btnChangeCountEl.addEventListener('click', () => {
      if (isRolling) return;
      modalEl.classList.remove('hidden');
    });

    btnRollEl.addEventListener('click', roll);

    window.addEventListener('keydown', (e) => {
      const modalOpen = !modalEl.classList.contains('hidden');
      if (modalOpen) {
        if (e.key === 'ArrowLeft' || e.key === '-') setDiceCount(diceCount - 1);
        else if (e.key === 'ArrowRight' || e.key === '+') setDiceCount(diceCount + 1);
        else if (e.key >= '1' && e.key <= '9') setDiceCount(Number(e.key));
        else if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btnStartEl.click();
        }
        return;
      }

      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        roll();
      }
    });

    buildDice();
  </script>
</body>
</html>

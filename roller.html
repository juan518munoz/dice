<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roll the Dice — Dice</title>
  <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dice" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/roller.css" />
  <script defer src="js/pwa.js"></script>
  <script defer src="js/dice-ui.js"></script>
  <script defer src="js/roller.js"></script>
</head>
<body>
  <main class="roller-screen">
    <header class="roller-header">
      <a class="btn-ghost" href="index.html">← Home</a>
      <div class="result-display" aria-live="polite">
        <span class="result-label">Total</span>
        <span class="result-value" id="roller-total-val">0</span>
      </div>
      <button type="button" class="btn-ghost" id="btn-roller-change-count">
        Dice: <span id="roller-hud-count">2</span>
      </button>
    </header>

    <section class="roller-stage">
      <div class="roller-dice-grid" id="roller-dice-grid"></div>
    </section>

    <footer class="roller-footer">
      <button type="button" class="btn-primary" id="btn-roller-roll" style="max-width: 320px;">Roll</button>
    </footer>
  </main>

  <!-- On-load & on-demand prompt for number of dice -->
  <div class="modal-backdrop" id="modal-roller-count" role="dialog" aria-modal="true" aria-labelledby="roller-modal-title">
    <div class="modal-card" style="align-items: center; text-align: center; max-width: 360px;">
      <h1 class="modal-title" id="roller-modal-title">How many dice?</h1>

      <div class="stepper">
        <button type="button" class="btn-step" id="btn-roller-minus" aria-label="Decrease">−</button>
        <div class="count-number" id="roller-modal-count">2</div>
        <button type="button" class="btn-step" id="btn-roller-plus" aria-label="Increase">+</button>
      </div>

      <div class="quick-picks" id="roller-quick-picks">
        <button type="button" class="btn-pick" data-count="1">1</button>
        <button type="button" class="btn-pick active" data-count="2">2</button>
        <button type="button" class="btn-pick" data-count="3">3</button>
        <button type="button" class="btn-pick" data-count="4">4</button>
        <button type="button" class="btn-pick" data-count="5">5</button>
        <button type="button" class="btn-pick" data-count="6">6</button>
      </div>

      <button type="button" class="btn-primary" id="btn-roller-start">Roll Dice</button>
    </div>
  </div>
</body>
</html>
